services:
  postgres:
    image: postgres:16-alpine
    container_name: bypass_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bypass_db
      POSTGRES_USER: bypass
      POSTGRES_PASSWORD: bypass
    ports:
      - "5434:5432"
    volumes:
      - bypass_postgres_data:/var/lib/postgresql/data

volumes:
  bypass_postgres_data: