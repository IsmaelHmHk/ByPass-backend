spring.application.name=bypass-backend
server.port=8080

# Conexion a PostgreSQL aislado en Docker (puerto 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/bypass_db
spring.datasource.username=bypass
spring.datasource.password=bypass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true