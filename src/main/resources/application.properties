spring.application.name=bypass-backend
server.port=8080

# Base de datos mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/bypass_db}
spring.datasource.username=${DB_USER:bypass}
spring.datasource.password=${DB_PASS:bypass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Ocultar detalles del servidor en cabeceras HTTP
spring.web.error.whitelabel.enabled=false

# Rechazar cualquier campo JSON que no exista en nuestros DTOs
spring.jackson.deserialization.fail-on-unknown-properties=true

# Ocultar informacion del servidor en errores
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Seguridad JWT (256-bit minimo en Base64)
app.jwt.secret=${JWT_SECRET:YnlwYXNzLXN1cGVyLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0yMDI2LW1hZHJpZC1jZXJjYW5pYXM=}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-days=7
app.cookie.secure=${COOKIE_SECURE:false}

# Proteccion contra payloads gigantes (DoS)
server.tomcat.max-http-form-post-size=1MB
spring.servlet.multipart.max-file-size=2MB

# Feeds GTFS-RT Renfe Cercanias
app.gtfsrt.enabled=${GTFSRT_ENABLED:true}
app.gtfsrt.trip-updates-url=https://gtfsrt.renfe.com/trip_updates.pb
app.gtfsrt.vehicle-positions-url=https://gtfsrt.renfe.com/vehicle_positions.pb